[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "funpay-deal"
version = "0.1.0"
description = "Telegram Mini App для безопасных сделок FunPay"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4",
    "aiohttp>=3.9",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
]

[project.scripts]
funpay-deal = "bot.__main__:run"

[tool.setuptools]
packages = ["bot", "bot.funpay"]

[tool.setuptools.package-data]
bot = ["webapp/*", "webapp/static/*"]